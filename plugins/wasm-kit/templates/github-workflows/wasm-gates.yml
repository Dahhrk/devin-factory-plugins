# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: wasm-gates

on:
  push:
  pull_request:

jobs:
  wasm-gates:
    name: wasm-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 wasm-rg-gate
        run: bash scripts/wasm-rg-gate.sh .
      - name: Tier 0.5 wasm-hotpath-gate
        run: bash scripts/wasm-hotpath-gate.sh .
      - name: Tier 1 wasm-tools-gate
        run: bash scripts/wasm-tools-gate.sh .
