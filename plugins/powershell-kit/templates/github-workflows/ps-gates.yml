# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: ps-gates

on:
  push:
  pull_request:

jobs:
  ps-gates:
    name: powershell-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 ps-rg-gate
        run: bash scripts/ps-rg-gate.sh .
      - name: Tier 0.5 ps-hotpath-gate
        run: bash scripts/ps-hotpath-gate.sh .
      - name: Tier 1 ps-pssa-gate
        run: bash scripts/ps-pssa-gate.sh .
