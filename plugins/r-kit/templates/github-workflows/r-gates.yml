# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: r-gates

on:
  push:
  pull_request:

jobs:
  r-gates:
    name: r-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 r-rg-gate
        run: bash scripts/r-rg-gate.sh .
      - name: Tier 0.5 r-hotpath-gate
        run: bash scripts/r-hotpath-gate.sh .
      - name: Tier 1 r-lintr-gate
        run: bash scripts/r-lintr-gate.sh .
