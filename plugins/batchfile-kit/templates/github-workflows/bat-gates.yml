# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: bat-gates

on:
  push:
  pull_request:

jobs:
  bat-gates:
    name: batchfile-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 bat-rg-gate
        run: bash scripts/bat-rg-gate.sh .
      - name: Tier 0.5 bat-hotpath-gate
        run: bash scripts/bat-hotpath-gate.sh .
      - name: Tier 1 bat-batch-gate
        run: bash scripts/bat-batch-gate.sh .
