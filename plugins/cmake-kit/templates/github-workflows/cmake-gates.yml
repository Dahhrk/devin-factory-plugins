# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: cmake-gates

on:
  push:
  pull_request:

jobs:
  cmake-gates:
    name: cmake-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 cmake-rg-gate
        run: bash scripts/cmake-rg-gate.sh .
      - name: Tier 0.5 cmake-hotpath-gate
        run: bash scripts/cmake-hotpath-gate.sh .
      - name: Tier 1 cmake-cmake-gate
        run: bash scripts/cmake-cmake-gate.sh .
