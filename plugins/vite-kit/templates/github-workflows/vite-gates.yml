# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: vite-gates

on:
  push:
  pull_request:

jobs:
  vite-gates:
    name: vite-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 vite-rg-gate
        run: bash scripts/vite-rg-gate.sh .
      - name: Tier 0.5 vite-hotpath-gate
        run: bash scripts/vite-hotpath-gate.sh .
      - name: Tier 1 vite-vite-gate
        run: bash scripts/vite-vite-gate.sh .
