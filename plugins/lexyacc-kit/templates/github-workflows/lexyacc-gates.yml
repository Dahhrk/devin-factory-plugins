# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: lexyacc-gates

on:
  push:
  pull_request:

jobs:
  lexyacc-gates:
    name: lexyacc-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 lexyacc-rg-gate
        run: bash scripts/lexyacc-rg-gate.sh .
      - name: Tier 0.5 lexyacc-hotpath-gate
        run: bash scripts/lexyacc-hotpath-gate.sh .
      - name: Tier 1 lexyacc-tool-gate
        run: bash scripts/lexyacc-tool-gate.sh .
