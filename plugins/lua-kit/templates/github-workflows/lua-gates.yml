# Copy to .github/workflows/lua-gates.yml.
# Needs scripts/lua-rg-gate.sh, lua-hotpath-gate.sh, .luacheckrc, glualint.json in the product.
# Pilot: Obsidian Framework. Tier 2 glualint required (PSR Lua ch.4 formatter/linter).

name: lua-gates

on:
  push:
    paths:
      - "**/*.lua"
      - ".luacheckrc"
      - "glualint.json"
      - "scripts/lua-rg-gate.sh"
      - "scripts/lua-hotpath-gate.sh"
      - "scripts/lua-luacheck-gate.sh"
      - "scripts/lua-glualint-gate.sh"
      - ".github/workflows/lua-gates.yml"
  pull_request:
    paths:
      - "**/*.lua"
      - ".luacheckrc"
      - "glualint.json"
      - "scripts/lua-rg-gate.sh"
      - "scripts/lua-hotpath-gate.sh"
      - "scripts/lua-luacheck-gate.sh"
      - "scripts/lua-glualint-gate.sh"
      - ".github/workflows/lua-gates.yml"
  workflow_dispatch:

jobs:
  tier0-rg:
    name: Tier 0 rg gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run lua-rg-gate
        run: bash scripts/lua-rg-gate.sh .

  tier05-hotpath:
    name: Tier 0.5 hotpath gate
    runs-on: ubuntu-latest
    needs: tier0-rg
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run lua-hotpath-gate
        run: bash scripts/lua-hotpath-gate.sh .

  tier1-luacheck:
    name: Tier 1 luacheck
    runs-on: ubuntu-latest
    needs: tier05-hotpath
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck
      - name: Ensure .luacheckrc
        run: |
          if [ ! -f .luacheckrc ]; then
            echo "Missing .luacheckrc - copy from lua-kit/templates/luacheckrc"
            exit 1
          fi
      - name: Run luacheck
        run: |
          if [ -x scripts/lua-luacheck-gate.sh ]; then
            bash scripts/lua-luacheck-gate.sh .
          else
            luacheck .
          fi

  tier2-glualint:
    name: Tier 2 glualint
    runs-on: ubuntu-latest
    needs: tier1-luacheck
    steps:
      - uses: actions/checkout@v4
      - name: Install glualint 1.30.0
        run: |
          set -euo pipefail
          curl -sL -o /tmp/glualint.zip \
            "https://github.com/FPtje/GLuaFixer/releases/download/1.30.0/glualint-1.30.0-x86_64-linux.zip"
          sudo unzip -o /tmp/glualint.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/glualint
          glualint version
      - name: Ensure glualint.json
        run: |
          if [ ! -f glualint.json ] && [ ! -f .glualint.json ]; then
            echo "Missing glualint.json - copy from lua-kit/templates/glualint.json"
            exit 1
          fi
      - name: Run glualint
        run: |
          if [ -x scripts/lua-glualint-gate.sh ]; then
            bash scripts/lua-glualint-gate.sh .
          else
            glualint lint .
          fi
