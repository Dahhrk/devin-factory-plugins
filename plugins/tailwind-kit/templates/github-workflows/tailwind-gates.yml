# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: tailwind-gates

on:
  push:
  pull_request:

jobs:
  tailwind-gates:
    name: tailwind-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 tailwind-rg-gate
        run: bash scripts/tailwind-rg-gate.sh .
      - name: Tier 0.5 tailwind-hotpath-gate
        run: bash scripts/tailwind-hotpath-gate.sh .
      - name: Tier 1 tailwind-tailwind-gate
        run: bash scripts/tailwind-tailwind-gate.sh .
