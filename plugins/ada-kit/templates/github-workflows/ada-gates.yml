# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: ada-gates

on:
  push:
  pull_request:

jobs:
  ada-gates:
    name: ada-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 ada-rg-gate
        run: bash scripts/ada-rg-gate.sh .
      - name: Tier 0.5 ada-hotpath-gate
        run: bash scripts/ada-hotpath-gate.sh .
      - name: Tier 1 ada-gnat-gate
        run: bash scripts/ada-gnat-gate.sh .
