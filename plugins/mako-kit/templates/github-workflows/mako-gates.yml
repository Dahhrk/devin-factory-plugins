# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: mako-gates

on:
  push:
  pull_request:

jobs:
  mako-gates:
    name: mako-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 mako-rg-gate
        run: bash scripts/mako-rg-gate.sh .
      - name: Tier 0.5 mako-hotpath-gate
        run: bash scripts/mako-hotpath-gate.sh .
      - name: Tier 1 mako-mako-gate
        run: bash scripts/mako-mako-gate.sh .
