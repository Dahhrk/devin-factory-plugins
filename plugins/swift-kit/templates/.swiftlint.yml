# Starter SwiftLint config for factory products (PSR Swift).
disabled_rules:
  - trailing_whitespace
opt_in_rules:
  - empty_count
  - force_unwrapping
  - force_try
  - force_cast
  - implicitly_unwrapped_optional
excluded:
  - .build
  - Tests
  - Package.swift
line_length:
  warning: 120
  error: 200
