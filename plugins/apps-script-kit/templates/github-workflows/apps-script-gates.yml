# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: apps-script-gates

on:
  push:
  pull_request:

jobs:
  apps-script-gates:
    name: apps-script-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 apps-script-rg-gate
        run: bash scripts/apps-script-rg-gate.sh .
      - name: Tier 0.5 apps-script-hotpath-gate
        run: bash scripts/apps-script-hotpath-gate.sh .
      - name: Tier 1 apps-script-clasp-gate
        run: bash scripts/apps-script-clasp-gate.sh .
