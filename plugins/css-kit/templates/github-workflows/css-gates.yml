# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: css-gates

on:
  push:
  pull_request:

jobs:
  css-gates:
    name: css-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 css-rg-gate
        run: bash scripts/css-rg-gate.sh .
      - name: Tier 0.5 css-hotpath-gate
        run: bash scripts/css-hotpath-gate.sh .
      - name: Tier 1 css-stylelint-gate
        run: bash scripts/css-stylelint-gate.sh .
