# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: sql-gates

on:
  push:
  pull_request:

jobs:
  sql-gates:
    name: sql-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 sql-rg-gate
        run: bash scripts/sql-rg-gate.sh .
      - name: Tier 0.5 sql-hotpath-gate
        run: bash scripts/sql-hotpath-gate.sh .
      - name: Tier 1 sql-sqlfluff-gate
        run: bash scripts/sql-sqlfluff-gate.sh .
