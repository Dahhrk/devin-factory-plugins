# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: objc-gates

on:
  push:
  pull_request:

jobs:
  objc-gates:
    name: objc-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
      - name: Tier 0 objc-rg-gate
        run: bash scripts/objc-rg-gate.sh .
      - name: Tier 0.5 objc-hotpath-gate
        run: bash scripts/objc-hotpath-gate.sh .
      - name: Tier 1 objc-fmt-gate
        run: bash scripts/objc-fmt-gate.sh .
