# Copy into product .github/workflows/ or merge steps into existing ci.yml.
name: makefile-gates

on:
  push:
  pull_request:

jobs:
  makefile-gates:
    name: makefile-kit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier 0 makefile-rg-gate
        run: bash scripts/makefile-rg-gate.sh .
      - name: Tier 0.5 makefile-hotpath-gate
        run: bash scripts/makefile-hotpath-gate.sh .
      - name: Tier 1 makefile-make-gate
        run: bash scripts/makefile-make-gate.sh .
