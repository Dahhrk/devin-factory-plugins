name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: node scripts/validate-plugins.mjs
      - name: Version bump on content changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs
      - name: Drift vs Cursor pack twin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUG_FACTORY_TOKEN: ${{ secrets.PLUG_FACTORY_TOKEN }}
          PLUG_FACTORY_READ_TOKEN: ${{ secrets.PLUG_FACTORY_READ_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/plug-factory
          TOKEN="${PLUG_FACTORY_TOKEN:-${PLUG_FACTORY_READ_TOKEN:-}}"
          if [ -n "$TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Dahhrk/plug-factory.git" /tmp/plug-factory
          else
            echo "::warning::PLUG_FACTORY_TOKEN unset; drifting against public Dahhrk/plugins"
            git clone --depth 1 https://github.com/Dahhrk/plugins /tmp/plug-factory
          fi
          node scripts/drift-check.mjs /tmp/plug-factory
          node scripts/drift-check.mjs /tmp/plug-factory --content || true
