name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, home-cluster]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: node scripts/validate-plugins.mjs
      - name: Version bump on content changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs
      - name: Drift vs the normal factory pack
        run: |
          rm -rf /tmp/plug-factory
          git clone --depth 1 https://github.com/Dahhrk/plugins /tmp/plug-factory
          node scripts/drift-check.mjs /tmp/plug-factory
